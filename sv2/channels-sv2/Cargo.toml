[package]
name = "channels_sv2"
# TODO: bump to 5.1.0 once the project's pinned Rust 1.75 toolchain can
# write the v4 Cargo.lock format (a version change here triggers a lockfile
# rewrite that 1.75 can't perform). The `add_shares` method added to the
# Vardiff trait in this commit is a minor-version semver change that
# downstream consumers should learn about via a version bump.
version = "5.0.0"
authors = ["The Stratum V2 Developers"]
edition = "2021"
readme = "README.md"
description = "Sv2 Channel Primitives"
documentation = "https://docs.rs/channels_sv2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stratum-mining/stratum"
homepage = "https://stratumprotocol.org"
keywords = ["stratum", "mining", "bitcoin", "protocol"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
binary_sv2 = { path = "../binary-sv2", version = "^5.0.0" }
mining_sv2 = { path = "../subprotocols/mining", version = "^9.0.0" }
template_distribution_sv2 = { path = "../subprotocols/template-distribution", version = "^5.0.0" }
tracing = { workspace = true }
bitcoin = { workspace = true }
primitive-types = { workspace = true }
hashbrown = { workspace = true, optional = true }


[features]
default = []
no_std = ["hashbrown"]
